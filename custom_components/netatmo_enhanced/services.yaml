set_boost:
  target:
    entity:
      integration: netatmo_enhanced
      domain: climate
  fields:
    duration:
      required: true
      default: 90
      selector:
        number:
          min: 30
          max: 90
          step: 30
          unit_of_measurement: min

stop_boost:
  target:
    entity:
      integration: netatmo_enhanced
      domain: climate

cycle_boost:
  target:
    entity:
      integration: netatmo_enhanced
      domain: climate

set_manual_temperature:
  target:
    entity:
      integration: netatmo_enhanced
      domain: climate
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 7
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      required: true
      selector:
        number:
          min: 1
          max: 720
          step: 1
          mode: box
          unit_of_measurement: min
